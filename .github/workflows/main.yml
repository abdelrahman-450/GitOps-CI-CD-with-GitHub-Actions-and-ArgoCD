
name: Docker CI CD Approval Pipeline

on:
  push:
    branches:
      - Master
    paths:
      - 'src/**'
      - 'Dockerfile'

jobs:
  docker-ci:
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t node-app:v1 .

      - name: Run Test Container
        run: |
          docker rm -f testcontainer || true
          docker run -d --name testcontainer -p 3000:3000 node-app:v1

      - name: Test Container
        run: |
          sleep 10
          curl -f http://localhost:3000

      - name: Remove Test Container
        if: always()
        run: docker rm -f testcontainer || true

  deploy:
    needs: docker-ci
    runs-on: [self-hosted, Linux, X64]
    environment: production

    steps:
      - name: Deploy Docker Container
        run: |
          docker rm -f production-app || true
          docker run -d --name production-app -p 8080:3000 node-app:v1

      - name: Verify Deployment
        run: |
          sleep 10
          curl -f http://localhost:8080
