
name: Docker CI Pipeline

on:
  push:
    branches:
      - Master

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t node-app:v1 .

      - name: Run Docker Container
        run: docker run -d --name testcontainer -p 3000:3000 node-app:v1

      - name: Test Container
        run: |
          sleep 10
          docker ps
          curl --fail http://localhost:3000

      - name: Show Container Logs
        if: always()
        run: docker logs testcontainer || true

      - name: Remove Test Container
        if: always()
        run: docker rm -f testcontainer || true
