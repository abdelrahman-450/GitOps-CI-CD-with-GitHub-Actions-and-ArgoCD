name: Docker CI Pipeline

on:
  push:
    branches:
      - Master

jobs:
  docker-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t node-app:v1 .

      - name: Run Docker Container
        run: docker run -d --name testcontainer -p 3000:3000 node-app:v1

      - name: Test Container
        run: |
          sleep 10
          docker ps
          curl --fail \
            --retry 10 \
            --retry-delay 3 \
            --retry-connrefused \
            http://localhost:3000

      - name: Show Container Logs
        if: always()
        run: docker logs testcontainer || true

      - name: Remove Test Container
        if: always()
        run: docker rm -f testcontainer || true

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag Docker Image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          docker tag node-app:v1 \
            "$DOCKERHUB_USERNAME/node-app:v1"

      - name: Push Docker Image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          docker push "$DOCKERHUB_USERNAME/node-app:v1"
