
name: Repository Variables Demo

on:
  push:
    branches:
      - Master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Print Repository Variables
        env:
          APP_NAME: ${{ vars.APP_NAME }}
          IMAGE_TAG: ${{ vars.IMAGE_TAG }}
        run: |
          echo "$APP_NAME"
          echo "$IMAGE_TAG"
